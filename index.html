<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plume Hunter - Advanced Geo-Temporal Matrix (v3.1 Pinpoint Fixed)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <style>
        .scifi-panel {
            background: rgba(10, 20, 30, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid #1e40af;
            box-shadow: 0 0 15px rgba(30, 64, 175, 0.4);
        }
        .scifi-glow-blue { box-shadow: 0 0 12px rgba(59, 130, 246, 0.6); }
        .leaflet-container { background: #020617 !important; }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.25); opacity: 0.6; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pulse-marker { animation: pulse 2s infinite ease-in-out; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col overflow-hidden">

    <header class="bg-slate-900 border-b border-blue-900 p-4 flex justify-between items-center z-10 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 bg-cyan-400 rounded-full animate-ping"></div>
            <h1 class="text-xl font-bold tracking-wider text-cyan-400 uppercase">Plume Hunter: Ayutthaya Confluence (v3.1)</h1>
        </div>
        <div class="flex items-center space-x-6 text-sm">
            <div class="bg-slate-950 px-3 py-1.5 border border-slate-800 rounded text-amber-400 text-xs">
                *คลิกขวาบนแผนที่เพื่อดูพิกัด (Dev Tool)*
            </div>
            <div class="bg-slate-950 px-3 py-1.5 border border-slate-800 rounded flex items-center space-x-2">
                <span class="text-slate-400">CRITICAL HP:</span>
                <div id="hp-container" class="flex space-x-1 text-red-500 font-bold">❤️ ❤️</div>
            </div>
        </div>
    </header>

    <div class="flex flex-1 w-full overflow-hidden">
        <!-- Map Container -->
        <div class="w-2/3 h-full relative border-r border-blue-900 bg-slate-900">
            <div id="map" class="w-full h-full cursor-crosshair"></div>
            <div class="absolute bottom-4 left-4 z-[1000] scifi-panel p-3 rounded-lg max-w-xs text-xs pointer-events-none">
                <div class="font-bold text-cyan-400 mb-1.5 uppercase tracking-wide border-b border-slate-700 pb-1">Legend (อยุธยา)</div>
                <div class="space-y-1 text-slate-300">
                    <div class="flex items-center space-x-2"><span class="w-3 h-3 rounded-full bg-red-600 block"></span> <span>จุดเกิดเหตุ</span></div>
                    <div class="flex items-center space-x-2"><span class="w-3 h-3 rounded bg-amber-500 block"></span> <span>โรงงานต้องสงสัย</span></div>
                    <div class="flex items-center space-x-2"><span class="w-5 h-0.5 bg-blue-500 block border-t border-dashed"></span> <span>ทิศทางน้ำ</span></div>
                </div>
            </div>
        </div>

        <!-- Dashboard -->
        <div class="w-1/3 h-full flex flex-col bg-slate-950 p-4 space-y-4 overflow-y-auto">
            <div class="scifi-panel p-3.5 rounded-lg border-l-4 border-l-cyan-500">
                <h2 class="text-xs font-bold text-cyan-400 uppercase tracking-wider mb-1">คดี: มลพิษทางน้ำเกาะเมืองอยุธยา</h2>
                <p class="text-xs text-slate-300 leading-relaxed">ค้นหาโรงงานที่แอบปล่อยน้ำเสียลงสู่แม่น้ำ</p>
            </div>

            <div class="scifi-panel p-3.5 rounded-lg">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2.5">⏱️ 1. เลือกช่วงเวลา</h3>
                <div class="grid grid-cols-3 gap-2 mb-4">
                    <button id="btn-day1" onclick="switchDay(1)" class="py-2 px-1 text-xs font-bold rounded border uppercase bg-slate-900 border-slate-700 text-slate-400 hover:bg-slate-800">Day 1</button>
                    <button id="btn-day2" onclick="switchDay(2)" class="py-2 px-1 text-xs font-bold rounded border uppercase bg-slate-900 border-slate-700 text-slate-400 hover:bg-slate-800">Day 2</button>
                    <button id="btn-day3" onclick="switchDay(3)" class="py-2 px-1 text-xs font-bold rounded border uppercase bg-slate-900 border-slate-700 text-slate-400 hover:bg-slate-800">Day 3</button>
                </div>

                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">🛰️ 2. ภาพถ่ายดาวเทียม</h3>
                <div class="grid grid-cols-1 gap-2 mb-3">
                    <button id="btn-rgb" onclick="switchImagery('RGB')" class="p-2 text-xs font-bold rounded border text-left flex justify-between items-center bg-slate-900 border-slate-700"><span>[RGB] True Color</span></button>
                    <button id="btn-nir" onclick="switchImagery('NIR')" class="p-2 text-xs font-bold rounded border text-left flex justify-between items-center bg-slate-900 border-slate-700"><span>[NIR] False Color</span></button>
                    <button id="btn-ndvi" onclick="switchImagery('NDVI')" class="p-2 text-xs font-bold rounded border text-left flex justify-between items-center bg-slate-900 border-slate-700"><span>[NDVI] Vegetation Index</span></button>
                </div>

                <label class="flex items-center space-x-3 bg-slate-900 border border-slate-800 p-2.5 rounded cursor-pointer hover:bg-slate-850">
                    <input type="checkbox" id="chk-flow" onchange="toggleFlowLayer()" class="w-4 h-4 accent-cyan-500">
                    <span class="text-xs font-bold text-cyan-400">เปิดซ้อนทับเส้นกระแสน้ำ (FLOW)</span>
                </label>
            </div>

            <div class="scifi-panel p-3.5 rounded-lg border-t-2 border-t-red-600">
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="executeRaid('A')" class="py-2 bg-slate-900 border border-amber-600 text-amber-400 rounded text-xs font-bold hover:bg-amber-950/40">RAID A</button>
                    <button onclick="executeRaid('B')" class="py-2 bg-slate-900 border border-amber-600 text-amber-400 rounded text-xs font-bold hover:bg-amber-950/40">RAID B</button>
                    <button onclick="executeRaid('C')" class="py-2 bg-slate-900 border border-amber-600 text-amber-400 rounded text-xs font-bold hover:bg-amber-950/40">RAID C</button>
                    <button onclick="executeRaid('D')" class="py-2 bg-slate-900 border border-amber-600 text-amber-400 rounded text-xs font-bold hover:bg-amber-950/40">RAID D</button>
                </div>
            </div>
            
            <!-- Log Terminal -->
            <div class="flex-1 min-h-[120px] bg-slate-950 border border-slate-800 rounded-lg p-3 font-mono text-[11px] flex flex-col">
                <div id="log-box" class="flex-1 overflow-y-auto space-y-1 text-slate-400 pr-1"></div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="end-modal" class="fixed inset-0 bg-slate-950/90 z-[9999] hidden flex items-center justify-center p-4">
        <div id="modal-content" class="max-w-md w-full scifi-panel p-6 rounded-xl text-center space-y-4"></div>
    </div>

    <script>
        let currentDay = 1;
        let currentImagery = 'RGB';
        let showFlow = false;
        let playerHP = 2;
        let gameActive = true;

        // --- พิกัดที่ปรับแก้ใหม่ (พยายามเกาะตลิ่งให้มากที่สุด) ---
        const mapCenter = [14.3450, 100.5750]; 
        const fishCageCoords = [14.3438, 100.5770]; // กลางน้ำ 
        
        const factories = {
            A: { name: "Zone A", coords: [14.34736, 100.57497] }, // ริมตลิ่งป่าสักฝั่งตก
            B: { name: "Zone B", coords: [14.34590, 100.57536] }, // ริมตลิ่งเจ้าพระยาฝั่งเหนือ
            C: { name: "Zone C", coords: [14.34679, 100.58107] }, // ริมคลองย่อย
            D: { name: "Zone D", coords: [14.33950, 100.57734] }  // ริมเจ้าพระยาตอนล่างฝั่งออก
        };

        const map = L.map('map', { zoomControl: true, minZoom: 14, maxZoom: 17 }).setView(mapCenter, 15);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Imagery Source'
        }).addTo(map);

        // --- DEVELOPER TOOL: คลิกขวาเพื่อหาพิกัด ---
        map.on('contextmenu', function(e) {
            const lat = e.latlng.lat.toFixed(5);
            const lng = e.latlng.lng.toFixed(5);
            
            // สร้าง Popup ตรงจุดที่คลิก
            L.popup()
                .setLatLng(e.latlng)
                .setContent(`<div class="text-slate-900 font-mono text-xs"><b>[${lat}, ${lng}]</b><br>คัดลอกตัวเลขนี้ไปใส่ในโค้ด (factories) ได้เลยครับ</div>`)
                .openOn(map);
                
            pushLog(`📍 [DevTool] พิกัดที่เล็ง: ${lat}, ${lng}`);
        });

        const markersGroup = L.layerGroup().addTo(map);
        const imageryLayersGroup = L.layerGroup().addTo(map);
        const flowLayerGroup = L.layerGroup().addTo(map);

        function initStaticMarkers() {
            markersGroup.clearLayers();

            const fishIcon = L.divIcon({
                className: 'pulse-marker',
                html: `<div class="w-8 h-8 bg-red-600 rounded-full border-2 border-white flex items-center justify-center font-bold text-white shadow-xl">☠️</div>`,
                iconSize: [32, 32], iconAnchor: [16, 16]
            });
            L.marker(fishCageCoords, { icon: fishIcon }).addTo(markersGroup);

            Object.keys(factories).forEach(key => {
                const factoryIcon = L.divIcon({
                    html: `<div class="flex items-center bg-amber-500 text-slate-950 font-bold text-[10px] px-2 py-1 rounded border border-slate-950 shadow-lg mt-2">🏭 ZONE ${key}</div>`,
                    className: '', iconSize: [70, 24], iconAnchor: [35, 0] // Anchor ไว้บนตลิ่งพอดี
                });
                L.marker(factories[key].coords, { icon: factoryIcon }).addTo(markersGroup);
            });
        }

        function updateMapLayers() {
            imageryLayersGroup.clearLayers();
            flowLayerGroup.clearLayers();

            if (currentDay === 2) {
                if (currentImagery === 'RGB') {
                    L.polyline([[14.3444, 100.5732], [14.3440, 100.5750], [14.3438, 100.5770]], {
                        color: '#78350f', weight: 12, opacity: 0.85, lineJoin: 'round'
                    }).addTo(imageryLayersGroup);
                    L.circle([14.3468, 100.5790], { color: '#f8fafc', fillColor: '#ffffff', fillOpacity: 0.9, radius: 300 }).addTo(imageryLayersGroup);
                } 
                else if (currentImagery === 'NIR') {
                    L.polyline([[14.3470, 100.5796], [14.3460, 100.5780], [14.3445, 100.5775], [14.3438, 100.5770]], {
                        color: '#09090b', weight: 8, opacity: 0.95, lineJoin: 'round'
                    }).addTo(imageryLayersGroup);
                }
            } 
            else if (currentDay === 3 && currentImagery === 'NDVI') {
                L.polyline([[14.3444, 100.5732], [14.3445, 100.5710]], { color: '#22c55e', weight: 5, opacity: 0.9 }).addTo(imageryLayersGroup);
                L.polyline([[14.3470, 100.5796], [14.3465, 100.5785]], { color: '#ef4444', weight: 5, opacity: 0.9 }).addTo(imageryLayersGroup);
            }

            if (showFlow) {
                let color = (currentDay === 3) ? '#ef4444' : '#2563eb';
                if (currentDay === 1 || currentDay === 2) {
                    drawFlowArrow([14.3503, 100.5775], [14.3460, 100.5775], color); 
                    drawFlowArrow([14.3468, 100.5795], [14.3458, 100.5775], color); 
                    drawFlowArrow([14.3440, 100.5720], [14.3438, 100.5760], color); 
                    drawFlowArrow([14.3438, 100.5770], [14.3385, 100.5775], color); 
                } else {
                    drawFlowArrow([14.3385, 100.5775], [14.3438, 100.5770], color); 
                    drawFlowArrow([14.3438, 100.5760], [14.3440, 100.5720], color);
                    drawFlowArrow([14.3458, 100.5775], [14.3468, 100.5795], color); 
                    drawFlowArrow([14.3460, 100.5775], [14.3503, 100.5775], color);
                }
            }
        }

        function drawFlowArrow(from, to, colorCode) {
            L.polyline([from, to], { color: colorCode, weight: 3, dashArray: '5, 8' }).addTo(flowLayerGroup);
            L.circleMarker(to, { radius: 4, color: colorCode, fillColor: colorCode, fillOpacity: 1 }).addTo(flowLayerGroup);
        }

        function switchDay(dayNum) {
            if (!gameActive) return;
            currentDay = dayNum;
            [1, 2, 3].forEach(d => {
                const btn = document.getElementById(`btn-day${d}`);
                btn.className = (d === dayNum) ? "py-2 px-1 text-xs font-bold rounded border uppercase bg-cyan-950 border-cyan-500 text-cyan-300 scifi-glow-blue" : "py-2 px-1 text-xs font-bold rounded border uppercase bg-slate-900 border-slate-700 text-slate-400 hover:bg-slate-800";
            });
            updateMapLayers();
        }

        function switchImagery(mode) {
            if (!gameActive) return;
            currentImagery = mode;
            ['RGB', 'NIR', 'NDVI'].forEach(m => {
                const btn = document.getElementById(`btn-${m.toLowerCase()}`);
                (m === mode) ? btn.classList.add('border-cyan-400', 'bg-slate-900', 'text-cyan-400') : btn.classList.remove('border-cyan-400', 'bg-slate-900', 'text-cyan-400');
            });
            updateMapLayers();
        }

        function toggleFlowLayer() {
            showFlow = document.getElementById('chk-flow').checked;
            updateMapLayers();
        }

        function pushLog(msg) {
            const box = document.getElementById('log-box');
            box.innerHTML += `<div><span class="text-cyan-600">></span> ${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        function executeRaid(zoneKey) {
            if (!gameActive) return;
            if (zoneKey === 'C') {
                showEndScreen(true, "เป้าหมายถูกล็อค!", "ภารกิจเสร็จสิ้น ตรวจพบสารเคมีที่ Zone C");
            } else {
                playerHP--;
                document.getElementById('hp-container').innerHTML = '❤️ '.repeat(playerHP) || '💀';
                if (playerHP <= 0) showEndScreen(false, "ภารกิจล้มเหลว", "โรงงานไหวตัวทัน");
            }
        }

        function showEndScreen(isWin, title, msg) {
            gameActive = false;
            document.getElementById('end-modal').classList.remove('hidden');
            document.getElementById('modal-content').innerHTML = `<h2 class="text-lg font-bold ${isWin ? 'text-emerald-400' : 'text-red-500'}">${title}</h2><p class="text-white">${msg}</p><button onclick="window.location.reload()" class="mt-4 px-4 py-2 bg-slate-900 border border-slate-700 rounded text-xs text-white">เล่นอีกครั้ง</button>`;
        }

        window.onload = () => { initStaticMarkers(); switchDay(1); switchImagery('RGB'); pushLog("ระบบพร้อมทำงาน. (คลิกขวาที่แผนที่เพื่อเล็งพิกัดจริง)"); };
    </script>
</body>
</html>
